services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    container_name: thoth-gateway
    command: uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      SERVICE_BREACH_URL: http://breach-lookup:8001
      SERVICE_SOCIAL_URL: http://social-harvester:8002
      SERVICE_DNS_URL: http://dns-investigator:8003
      SERVICE_IP_URL: http://ip-geoloc:8004
      SERVICE_PERSON_FINDER_URL: http://person-finder:8005
      SERVICE_EMAIL_INVESTIGATOR_URL: http://email-investigator:8006
      SERVICE_WEB_SCANNER_URL: http://web-scanner:8007
      SERVICE_WAYBACK_MACHINE_URL: http://wayback-machine:8008
      SERVICE_IMAGE_SEARCH_URL: http://image-search:8009
      SERVICE_PHONE_ANALYZER_URL: http://phone-analyzer:8010
      SERVICE_TEXT_ANALYZER_URL: http://text-analyzer:8011
      SERVICE_URL_EXPANDER_URL: http://url-expander:8012
      SERVICE_SHODAN_LOOKUP_URL: http://shodan-lookup:8013
    volumes:
      - ./backend:/app
      - thoth_data:/data
    depends_on:
      - breach-lookup
      - social-harvester
      - dns-investigator
      - ip-geoloc
      - person-finder
      - email-investigator
      - web-scanner
      - wayback-machine
      - image-search
      - phone-analyzer
      - text-analyzer
      - url-expander
      - shodan-lookup
    working_dir: /app
    restart: unless-stopped

  breach-lookup:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    container_name: thoth-breach-lookup
    command: uvicorn services.breach_lookup.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
      - thoth_data:/data
    working_dir: /app
    restart: unless-stopped

  social-harvester:
