services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    container_name: thoth-gateway
    command: uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      SERVICE_BREACH_URL: http://breach-lookup:8001
      SERVICE_SOCIAL_URL: http://social-harvester:8002
      SERVICE_DNS_URL: http://dns-investigator:8003
      SERVICE_IP_URL: http://ip-geoloc:8004
    volumes:
      - ./backend:/app
      - thoth_data:/data
    depends_on:
      - breach-lookup
      - social-harvester
      - dns-investigator
      - ip-geoloc
    working_dir: /app
    restart: unless-stopped

  breach-lookup:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    container_name: thoth-breach-lookup
    command: uvicorn services.breach_lookup.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
      - thoth_data:/data
    working_dir: /app
    restart: unless-stopped

  social-harvester:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    container_name: thoth-social-harvester
    command: uvicorn services.social_harvester.main:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
      - thoth_data:/data
    working_dir: /app
    restart: unless-stopped

  dns-investigator:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    container_name: thoth-dns-investigator
    command: uvicorn services.dns_investigator.main:app --host 0.0.0.0 --port 8003 --reload
    ports:
      - "8003:8003"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
      - thoth_data:/data
    working_dir: /app
    restart: unless-stopped

  ip-geoloc:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    container_name: thoth-ip-geoloc
    command: uvicorn services.ip_geoloc.main:app --host 0.0.0.0 --port 8004 --reload
    ports:
      - "8004:8004"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
      - thoth_data:/data
    working_dir: /app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: thoth-frontend
    ports:
      - "3000:80"
    env_file:
      - frontend/.env
    restart: unless-stopped

volumes:
  thoth_data:
