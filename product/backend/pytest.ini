[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: Tests unitaires (logique métier isolée)
    integration: Tests d'intégration (Front/Back/BDD)
    functional: Tests fonctionnels (parcours utilisateur complet)
    regression: Tests de non-régression
    resilience: Tests de résilience (timeout, rate limit, échec API)
    security: Tests de sécurité (injection, validation)
    real_connectivity: Tests de connectivité réelle (validation terrain)
    slow: Tests longs (marquer pour exclusion rapide)
